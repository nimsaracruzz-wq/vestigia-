<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Metadata -->
    <title>VESTIGIA® | Luxury Clothing &amp; Premium Essentials</title>
    <meta name="description" content="VESTIGIA® is an independent luxury contemporary apparel brand designed in Italy and crafted in Sri Lanka. Discover our 280 GSM heavyweight organic cotton oversized T-shirts and refined streetwear." />
    <meta name="keywords" content="VESTIGIA, luxury fashion, luxury streetwear, Italian streetwear, 280 GSM t-shirt, oversized t-shirt, high-end apparel, designer clothing Italy" />
    <meta name="author" content="VESTIGIA® Couture Atelier" />
    <meta name="publisher" content="VESTIGIA® International" />
    <meta name="theme-color" content="#171412" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Canonical & Alternate Locales -->
    <link rel="canonical" href="https://thevestigia.com/" />
    <link rel="alternate" hreflang="x-default" href="https://thevestigia.com/" />
    <link rel="alternate" hreflang="en" href="https://thevestigia.com/" />
    <link rel="alternate" hreflang="en-IT" href="https://thevestigia.com/it/" />
    <link rel="alternate" hreflang="en-FR" href="https://thevestigia.com/fr/" />
    <link rel="alternate" hreflang="en-DE" href="https://thevestigia.com/de/" />
    <link rel="alternate" hreflang="en-ES" href="https://thevestigia.com/es/" />
    <link rel="alternate" hreflang="en-NL" href="https://thevestigia.com/nl/" />
    <link rel="alternate" hreflang="en-BE" href="https://thevestigia.com/be/" />
    <link rel="alternate" hreflang="en-AT" href="https://thevestigia.com/at/" />
    <link rel="alternate" hreflang="en-CH" href="https://thevestigia.com/ch/" />
    <link rel="alternate" hreflang="en-JP" href="https://thevestigia.com/jp/" />
    <link rel="alternate" hreflang="en-LK" href="https://thevestigia.com/lk/" />

    <!-- Performance: Preconnect & DNS-Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    
    <!-- Font Preloading -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Asset Preload -->
    <link rel="preload" as="image" href="/images/products/vestigia_logo.png" type="image/png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/products/vestigia_logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/products/vestigia_logo.png" />

    <!-- Open Graph Metadata -->
    <meta property="og:site_name" content="VESTIGIA®" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VESTIGIA® | Luxury Clothing &amp; Premium Essentials" />
    <meta property="og:description" content="Designed in Italy. Crafted in Sri Lanka. Experience the Aurelius Collection featuring 280 GSM heavyweight cotton and architectural drop-shoulder silhouettes." />
    <meta property="og:url" content="https://thevestigia.com/" />
    <meta property="og:image" content="https://thevestigia.com/images/products/vestigia_logo.png" />
    <meta property="og:image:alt" content="VESTIGIA Primary Emblem Logo" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="it_IT" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@vestigia_official" />
    <meta name="twitter:creator" content="@vestigia_official" />
    <meta name="twitter:title" content="VESTIGIA® | Luxury Clothing &amp; Premium Essentials" />
    <meta name="twitter:description" content="Designed in Italy. Crafted in Sri Lanka. Discover 280 GSM heavyweight oversized streetwear." />
    <meta name="twitter:image" content="https://thevestigia.com/images/products/vestigia_logo.png" />

    <!-- Master Knowledge Graph Schema (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://thevestigia.com/#organization",
          "name": "VESTIGIA®",
          "legalName": "VESTIGIA International Ltd.",
          "url": "https://thevestigia.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://thevestigia.com/images/products/vestigia_logo.png",
            "caption": "VESTIGIA Primary Brand Emblem"
          },
          "sameAs": [
            "https://www.instagram.com/vestigia_official",
            "https://www.linkedin.com/company/vestigia-fashion",
            "https://twitter.com/vestigia_official",
            "https://www.pinterest.com/vestigia_official"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "concierge@thevestigia.com",
            "contactType": "customer service",
            "availableLanguage": ["English", "Italian"]
          },
          "slogan": "Designed in Italy. Made in Sri Lanka. Leave Your Mark."
        },
        {
          "@type": "Brand",
          "@id": "https://thevestigia.com/#brand",
          "name": "VESTIGIA®",
          "logo": "https://thevestigia.com/images/products/vestigia_logo.png"
        },
        {
          "@type": "WebSite",
          "@id": "https://thevestigia.com/#website",
          "url": "https://thevestigia.com",
          "name": "VESTIGIA® Official Online Store",
          "publisher": { "@id": "https://thevestigia.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://thevestigia.com/shop?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
